[package]
name = "sigpipe"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Asciiverse pipe-laying race against the data stream, after Pipe Mania; Rust + Ratatui"

[dependencies]
ratatui = "0.30"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
iroh = "1.0.2"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync", "io-util"] }
socket2 = { version = "0.6", features = ["all"] }
rodio = { version = "0.22", default-features = false, features = ["playback"] }
gilrs = { version = "0.11", optional = true }

[features]
default = ["gamepad"]
gamepad = ["dep:gilrs"]

[profile.release]
debug = 1
